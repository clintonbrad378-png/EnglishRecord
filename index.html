<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5f1" />
    <meta
      name="description"
      content="Grabadora de voz con transcripción en vivo en inglés. Whisper y Silero VAD funcionan de forma privada en tu dispositivo."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="English Record" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>English Record · Transcripción privada</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f5f1;
      }
      body {
        color: #1d1a1c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(120% 80% at 50% 0%, #fff8f2 0%, #f7f5f1 52%, #f2eee8 100%);
        transition: opacity 0.36s ease, visibility 0.36s ease;
      }
      .boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-splash svg {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 12px 28px rgba(244, 81, 63, 0.24));
      }
      .boot-splash p {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .boot-splash span {
        margin-top: -12px;
        color: #867d78;
        font-size: 13px;
      }
      .boot-bar {
        width: 132px;
        height: 4px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(29, 26, 28, 0.08);
      }
      .boot-bar i {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #f4513f;
        animation: boot-loading 1.1s ease-in-out infinite alternate;
      }
      .boot-splash.has-error .boot-bar {
        display: none;
      }
      .boot-splash.has-error span {
        max-width: 280px;
        text-align: center;
        line-height: 1.5;
      }
      @keyframes boot-loading {
        from {
          transform: translateX(-10%);
        }
        to {
          transform: translateX(140%);
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0e0d12;
          color: #f6f2ed;
        }
        .boot-splash {
          background: radial-gradient(120% 80% at 50% 0%, #20151a 0%, #0e0d12 55%, #0a090d 100%);
        }
        .boot-splash span {
          color: #9d949e;
        }
        .boot-bar {
          background: rgba(255, 255, 255, 0.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay-root"></div>
    <div id="toast-root" aria-live="polite" aria-atomic="false"></div>

    <div class="boot-splash" id="boot-splash">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="10" fill="url(#bootGradient)" />
        <rect x="9" y="12" width="2.2" height="8" rx="1.1" fill="white" fill-opacity=".92" />
        <rect x="13" y="8.5" width="2.2" height="15" rx="1.1" fill="white" />
        <rect x="17" y="10.5" width="2.2" height="11" rx="1.1" fill="white" fill-opacity=".92" />
        <rect x="21" y="13" width="2.2" height="6" rx="1.1" fill="white" fill-opacity=".8" />
        <defs>
          <linearGradient id="bootGradient" x1="4" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FF7A5C" />
            <stop offset=".55" stop-color="#F4513F" />
            <stop offset="1" stop-color="#D83A34" />
          </linearGradient>
        </defs>
      </svg>
      <p>English Record</p>
      <span data-role="boot-label">Transcripción privada en tu dispositivo</span>
      <span class="boot-detail" data-role="boot-detail" hidden></span>
      <div class="boot-bar"><i></i></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
