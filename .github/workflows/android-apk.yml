name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.3.13750724"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libclang-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Init Tauri Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run tauri -- android init --ci
          fi

      - name: Ensure Android audio permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for perm in [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]:
              if perm not in s:
                  s = s.replace('<uses-permission android:name="android.permission.INTERNET" />', '<uses-permission android:name="android.permission.INTERNET" />\n    ' + perm, 1)
          p.write_text(s)
          PY

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: npm run tauri -- android build --apk --target aarch64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-record-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
