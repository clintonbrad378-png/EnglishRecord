name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: ""

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.3.13750724" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libclang-dev

      - name: Set libclang path
        run: |
          sudo apt-get install -y llvm-dev libclang-dev clang
          LIBCLANG=$(dirname "$(find /usr/lib/llvm-* /usr/lib -name 'libclang.so' -o -name 'libclang.so.*' 2>/dev/null | head -n1)")
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
          echo "Resolved LIBCLANG_PATH=$LIBCLANG"
          ls -la "$LIBCLANG"/libclang* | head -n 20

      - name: Install npm dependencies
        run: npm ci

      - name: Init Tauri Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run tauri -- android init --ci
          fi

      - name: Ensure Android audio permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for perm in [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]:
              if perm not in s:
                  s = s.replace('<uses-permission android:name="android.permission.INTERNET" />', '<uses-permission android:name="android.permission.INTERNET" />\n    ' + perm, 1)
          p.write_text(s)
          PY

      - name: Stage Android native C++ runtime
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cp "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/

      - name: Patch whisper-rs-sys for Android
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          BUILD_RS=$(find "$CARGO_HOME/registry/src" -path '*/whisper-rs-sys-0.14.1/build.rs' | head -n1)
          if [ -z "$BUILD_RS" ]; then
            echo "whisper-rs-sys build.rs not found"; exit 1
          fi
          python3 - "$BUILD_RS" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          old = 'let is_cmake_flag = key.starts_with("CMAKE_");'
          new = '''let is_cmake_flag = key.starts_with("CMAKE_")
            || key == "ANDROID_ABI"
            || key == "ANDROID_PLATFORM"
            || key == "ANDROID_NDK"
            || key == "ANDROID_STL"
            || key == "ANDROID_NATIVE_API_LEVEL";'''
          if old not in s:
              print('cmake flag pattern not found or already patched')
          else:
              s = s.replace(old, new)
              print('patched cmake flags')

          old2 = '''    if cfg!(not(feature = "openmp")) {
        config.define("GGML_OPENMP", "OFF");
    }'''
          new2 = '''    if cfg!(not(feature = "openmp")) {
        config.define("GGML_OPENMP", "OFF");
    }

    if env::var("CARGO_CFG_TARGET_OS").as_deref() == Ok("android") {
        config.define("GGML_NATIVE", "OFF");
        config.define("GGML_LLAMAFILE", "OFF");
        config.define("GGML_BACKEND_DL", "OFF");
        config.define("BUILD_SHARED_LIBS", "OFF");
    }'''
          if old2 not in s:
              print('android config pattern not found or already patched')
          else:
              s = s.replace(old2, new2)
              print('patched android config')
          p.write_text(s)
          PY

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
          WHISPER_DONT_GENERATE_BINDINGS: "1"
          CMAKE_TOOLCHAIN_FILE: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724/build/cmake/android.toolchain.cmake
          CMAKE_ANDROID_ARCH_ABI: arm64-v8a
          CMAKE_ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
          CMAKE_SYSTEM_VERSION: "24"
          ANDROID_PLATFORM: android-24
          ANDROID_ABI: arm64-v8a
          ANDROID_STL: c++_shared
        run: |
          # Evita reutilizar objetos C/C++ compilados sin toolchain Android (cache stale).
          find src-tauri/target -path '*/build/whisper-rs-sys-*' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find src-tauri/target -path '*/build/whisper-rs-*' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          npm run tauri -- android build --apk --target aarch64

      - name: Verify native libs
        run: |
          SO=$(find src-tauri/target/aarch64-linux-android/release -name "libenglish_record_lib.so" | head -n1)
          echo "Native lib: $SO"
          ls -lh "$SO"
          readelf -d "$SO" | grep NEEDED | grep -E 'c\+\+_shared|log|android|dl|m|c' || true
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "libc\+\+_shared\.so|libenglish_record_lib\.so"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS_VAL=${KEY_ALIAS:-englishrecord}" >> "$GITHUB_ENV"
            echo "KEY_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using stable signing key from secrets"
          else
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass englishrecord -keypass englishrecord \
              -alias englishrecord -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=English Record, OU=Dev, O=EnglishRecord, L=NA, S=NA, C=US"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KS_PASS=englishrecord" >> "$GITHUB_ENV"
            echo "KEY_ALIAS_VAL=englishrecord" >> "$GITHUB_ENV"
            echo "KEY_PASS=englishrecord" >> "$GITHUB_ENV"
            echo "Using generated signing key (no secrets configured)"
          fi

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n1)
          echo "Signing $APK"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS_VAL" \
            --key-pass "pass:$KEY_PASS" \
            --out "$(dirname "$APK")/english-record-signed.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-record-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/english-record-signed.apk
          if-no-files-found: error
