name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: ""

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.3.13750724" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libclang-dev

      - name: Set libclang path
        run: |
          sudo apt-get install -y llvm-dev libclang-dev clang
          LIBCLANG=$(dirname "$(find /usr/lib/llvm-* /usr/lib -name 'libclang.so' -o -name 'libclang.so.*' 2>/dev/null | head -n1)")
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
          echo "Resolved LIBCLANG_PATH=$LIBCLANG"
          ls -la "$LIBCLANG"/libclang* | head -n 20

      - name: Install npm dependencies
        run: npm ci

      - name: Init Tauri Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run tauri -- android init --ci
          fi

      - name: Ensure Android audio permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for perm in [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]:
              if perm not in s:
                  s = s.replace('<uses-permission android:name="android.permission.INTERNET" />', '<uses-permission android:name="android.permission.INTERNET" />\n    ' + perm, 1)
          p.write_text(s)
          PY

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
        run: npm run tauri -- android build --apk --target aarch64

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n1)
          echo "Signing $APK"
          keytool -genkeypair             -keystore "$RUNNER_TEMP/release.keystore"             -storepass englishrecord -keypass englishrecord             -alias englishrecord -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=English Record, OU=Dev, O=EnglishRecord, L=NA, S=NA, C=US"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign             --ks "$RUNNER_TEMP/release.keystore"             --ks-pass pass:englishrecord --key-pass pass:englishrecord             --out "$(dirname "$APK")/english-record-signed.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-record-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/english-record-signed.apk
          if-no-files-found: error
