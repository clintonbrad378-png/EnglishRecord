[package]
name = "english-record"
version = "1.0.0"
description = "Grabadora de voz con transcripción en vivo en el dispositivo"
authors = ["English Record"]
edition = "2021"

[lib]
name = "english_record_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = ["custom-protocol"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
whisper-rs = { version = "0.15", optional = true }

[features]
desktop = ["whisper-rs"]
