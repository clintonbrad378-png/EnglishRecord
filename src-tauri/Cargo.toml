[package]
name = "english-record"
version = "1.0.0"
description = "Grabadora de voz con transcripción en vivo en el dispositivo"
authors = ["English Record"]
edition = "2021"

[lib]
name = "english_record_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
ndk = "0.9"
ndk-sys = "0.6"
ndk-context = "0.1"
jni = "0.21"
